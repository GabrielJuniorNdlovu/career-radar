services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: careerradar
      MYSQL_USER: careerradar
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-careerradar}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-development-only}
    ports:
      - '127.0.0.1:3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  mysql_data:
