[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "career-radar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "pymysql>=1.1,<2", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "pycountry>=24.6,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3"]

[project.scripts]
career-radar = "career_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["mysql: requires TEST_DATABASE_URL pointing to a disposable MySQL database"]

[tool.ruff]
line-length = 100
extend-exclude = [".agents", ".vscode"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
